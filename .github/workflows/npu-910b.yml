name: Community NPU 910B
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    name: Probe / ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: linux-aarch64-a2-mojo-fed-1
            cards: 1
          - runner: linux-aarch64-a2-mojo-fed-2
            cards: 2
          - runner: linux-aarch64-a2-mojo-fed-4
            cards: 4
          - runner: linux-aarch64-a2-mojo-fed-8
            cards: 8
          - runner: linux-aarch64-a2b3-1-hk-001
            cards: 1
          - runner: linux-aarch64-a2b3-2-hk-001
            cards: 2
          - runner: linux-aarch64-a2b3-4-hk-001
            cards: 4
          - runner: linux-aarch64-a2b3-8-hk-001
            cards: 8
    container:
      image: quay.io/ascend/triton:3.2.2-cann9.1.0-torch_npu2.7.1.post8-910b-ubuntu24.04-py3.11@sha256:b69d14f39d47ec8f66e635f16190788e3c2b2174d0994f63090afcdf885b06f1
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}
    env:
      EXPECTED_CARDS: ${{ matrix.cards }}
      SCALE_SET: ${{ matrix.runner }}
      TORCH_TRANSFER_TO_NPU: "0"
    steps:
      - name: Verify device allocation and compute
        run: |
          source /usr/local/Ascend/ascend-toolkit/set_env.sh
          npu-smi info
          python3 - <<'PYTHON'
          import json, os, platform
          import torch, torch_npu, triton
          count = torch.npu.device_count()
          details = {
              "scale_set": os.environ["SCALE_SET"],
              "cpu": platform.machine(), "torch": torch.__version__,
              "torch_npu": torch_npu.__version__, "triton": triton.__version__,
              "cards": count,
              "visible_devices": os.environ.get("ASCEND_RT_VISIBLE_DEVICES"),
              "devices": [torch.npu.get_device_name(i) for i in range(count)],
          }
          print(json.dumps(details), flush=True)
          assert platform.machine() == "aarch64"
          assert count == int(os.environ["EXPECTED_CARDS"])
          for i in range(count):
              torch.npu.set_device(i)
              x = torch.arange(16, device=f"npu:{i}", dtype=torch.float32)
              torch.testing.assert_close((x + 1).cpu(), torch.arange(16, dtype=torch.float32) + 1)
              a = torch.ones((64, 64), device=f"npu:{i}", dtype=torch.float16)
              torch.testing.assert_close((a @ a).cpu(), torch.full((64, 64), 64., dtype=torch.float16))
              torch.npu.synchronize()
              print(f"Device {i}: compute passed", flush=True)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("```json\n" + json.dumps(details, indent=2) + "\n```\n")
          PYTHON
