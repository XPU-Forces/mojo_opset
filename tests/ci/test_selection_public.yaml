# CI test selection rules, initially based on master e5e233ad6b950088af8beaeb71c5290c196803be.
# rules match repository-relative paths; * matches one component, ** matches directories.
# jobs select complete non-empty test file lists (or full).
# Jobs marked full override selected files for the same job.

