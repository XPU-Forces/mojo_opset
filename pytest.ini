[pytest]
testpaths = tests
pythonpath = .
log_cli = true
log_cli_level = INFO
log_cli_format = [%(levelname)s] %(asctime)s >> %(message)s
log_cli_date_format = %m/%d/%Y %H:%M:%S
markers =
    accuracy: reference precision and operator contract checks
    bitwise: repeated forward/backward byte equality checks
    api(*names): public functions/modules exercised by this reference or bitwise test
